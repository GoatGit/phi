          <li>PHI 1.0 正式发布：把 AI 编程工具接进同一套本地网关。</li>

          <li>新增 ZCode 桌面端支持。</li>
          <li>内嵌终端支持分屏，退出 CLI 也不会黑屏。</li>
      </ul>
