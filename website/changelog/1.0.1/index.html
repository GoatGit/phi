        <h1 id="version-title">1.0.1</h1>
        <time class="changelog-date" datetime="2026-10-19">2026-10-19</time>
      </div>
      <ul class="changelog-items">

          <li>路由页改成一行一个应用，点开就能设路由、新建路由组。</li>
          <li>路由组可以混装不同协议的模型，任何一个应用都能直接用。</li>
          <li>侧边栏列出全部可路由应用，用得少的默认折叠，随时展开。</li>
          <li>终端启动时就套用你的配色，不再先闪一帧默认主题。</li>
          <li>前端构建链路的依赖升级，修掉已公布的安全告警。</li>
      </ul>
      <p class="changelog-back"><a href="../">← 全部版本</a> · <a href="../1.0.0/">1.0.0 →</a></p>
