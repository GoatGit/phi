name: Deploy website

# 线上站点是纯静态生成物：英日页面由 website/index.html 生成，更新日志页面由
# scripts/changelog.json 生成。只在真正影响发布内容的改动上部署，避免一次无关的
# Rust 或前端提交把生产环境也动一遍。
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build_website.py"
      - "scripts/build_changelog.py"
      - "scripts/test_website.py"
      - "scripts/changelog.json"
      - "scripts/website-translations.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

# 同一时间只跑一个部署。两次上传并发时，生产别名会指向最后完成的那一个，
# 而那未必是更新的那个。
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 与 ci.yml 同一道门禁。发布出过期的英日页面，或让更新日志缺少应用内
      # 弹窗所链接的版本，比不部署更糟。
      - name: Verify generated pages are current
        run: |
          python3 scripts/build_website.py --check
          python3 scripts/build_changelog.py --check
          python3 scripts/test_website.py

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # 固定版本：新的 wrangler 发布不应悄悄改变上传内容。升级时与
      # docs/website.md 里验证过的命令一起改。
      # CLOUDFLARE_ACCOUNT_ID 是公开的账号标识，放在仓库变量里；只有令牌是机密。
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 pages deploy website --project-name=phi-website --branch=main

      # wrangler 只证明上传被接受。再确认三个入口真的能应答，并确认 _headers
      # 仍然生效——丢失它会让安全响应头静默消失。
      - name: Verify production entry points and headers
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS -o /dev/null https://phi.semibot.ai/ \
              && curl -fsS -o /dev/null https://phi.semibot.ai/en/ \
              && curl -fsS -o /dev/null https://phi.semibot.ai/ja/; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "Production did not answer after the deploy." >&2
              exit 1
            fi
            echo "Attempt ${attempt}: not answering yet, retrying in 10s."
            sleep 10
          done
          headers=$(curl -fsSI https://phi.semibot.ai/)
          echo "$headers"
          echo "$headers" | grep -qi '^x-content-type-options: *nosniff' \
            || { echo "X-Content-Type-Options missing: website/_headers was not applied." >&2; exit 1; }
          echo "$headers" | grep -qi '^x-frame-options: *DENY' \
            || { echo "X-Frame-Options missing: website/_headers was not applied." >&2; exit 1; }
