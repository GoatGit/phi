name: DNS probe

# 临时探针：确认 macOS runner 上 codeberg.org 的解析与可达性。
# 用完即删，不进入主干。

on:
  workflow_dispatch:
  push:
    branches: [chore/release-1.0.5]
    paths: ['.github/workflows/dns-probe.yml']

jobs:
  probe:
    name: Probe codeberg.org resolution
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Control comparisons
        run: |
          echo '--- dig github.com @8.8.8.8 (is port 53 blocked?)'
          dig +short github.com @8.8.8.8 || true
          echo '--- dig github.com default resolver'
          dig +short github.com || true
          echo '--- curl https://github.com'
          curl -s -o /dev/null -w 'github=%{http_code}\n' --max-time 15 https://github.com/ || true

      - name: Resolve codeberg over DoH
        run: |
          echo '--- cloudflare doh'
          curl -s --max-time 15 -H 'accept: application/dns-json' \
            'https://1.1.1.1/dns-query?name=codeberg.org&type=A' || true
          echo
          echo '--- google doh'
          curl -s --max-time 15 'https://dns.google/resolve?name=codeberg.org&type=A' || true
          echo

      - name: Pin and verify
        run: |
          set -euo pipefail
          ip=$(curl -s --max-time 15 'https://dns.google/resolve?name=codeberg.org&type=A' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((a["data"] for a in d.get("Answer",[]) if a.get("type")==1), ""))' || true)
          echo "ip=$ip"
          if [ -n "$ip" ]; then
            echo "$ip codeberg.org" | sudo tee -a /etc/hosts
            sudo dscacheutil -flushcache || true
            echo '--- after pin'
            curl -s -o /dev/null -w 'pinned=%{http_code}\n' --max-time 20 https://codeberg.org/ || true
            dig +short codeberg.org || true
          else
            echo 'no ip from DoH'
          fi
