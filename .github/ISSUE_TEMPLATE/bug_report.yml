name: "🐛 Bug Report / Bug 报告"
description: |
  Report errors or unexpected behavior.
  报告错误或异常行为。
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Self Checks / 自检
      options:
        - label: |
            I have read the [FAQ](https://github.com/GoatGit/phi#faq) section in README.
            我已阅读 README 中的[常见问题](https://github.com/GoatGit/phi#faq)。
          required: true
        - label: |
            I have searched for [existing issues](https://github.com/GoatGit/phi/issues), including closed ones.
            我已搜索过[已有的 Issue](https://github.com/GoatGit/phi/issues)，包括已关闭的。
          required: true

  - type: input
    attributes:
      label: PHI Version / PHI 版本号
      description: |
        See Settings → About in the app.
        在应用的「设置 → 关于」中查看版本号。
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Operating System / 操作系统
      multiple: false
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Related App / 涉及应用
      description: |
        Which app is affected?
        涉及哪个应用？
      multiple: true
      options:
        - Claude Code
        - Claude Desktop
        - Codex
        - Gemini CLI
        - Grok Build
        - OpenCode
        - OpenClaw
        - Hermes
        - Pi
        - MiniMax Code
        - Other / 其他
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce / 重现步骤
      description: |
        Please describe a minimal reproduction. Redact credentials and private paths from screenshots and logs.
        请描述最小复现步骤，截图与日志请先移除凭据和私人路径。
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior / 期望行为
      description: |
        What did you expect to happen?
        你期望发生什么？
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual Behavior / 实际行为
      description: |
        What actually happened?
        实际发生了什么？
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context / 补充信息
      description: |
        Include CLI version, OS version and CPU architecture. Never attach API keys, OAuth files or complete databases.
        请补充 CLI 版本、系统版本与 CPU 架构。不要上传 API Key、OAuth 文件或完整数据库。
    validations:
      required: false
