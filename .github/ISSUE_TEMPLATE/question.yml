name: "❓ Question / 提问"
description: |
  Ask a question about usage or configuration.
  询问使用或配置相关问题。
labels:
  - question
body:
  - type: checkboxes
    attributes:
      label: Self Checks / 自检
      options:
        - label: |
            I have read the [FAQ](https://github.com/GoatGit/phi#faq) section in README.
            我已阅读 README 中的[常见问题](https://github.com/GoatGit/phi#faq)。
          required: true
        - label: |
            I have searched for [existing issues](https://github.com/GoatGit/phi/issues), including closed ones.
            我已搜索过[已有的 Issue](https://github.com/GoatGit/phi/issues)，包括已关闭的。
          required: true

  - type: dropdown
    attributes:
      label: Related App / 涉及应用
      description: |
        Which app is your question about?
        你的问题涉及哪个应用？
      multiple: true
      options:
        - Claude Code
        - Claude Desktop
        - Codex
        - Gemini CLI
        - Grok Build
        - OpenCode
        - OpenClaw
        - Hermes
        - Pi
        - MiniMax Code
        - General / 通用
    validations:
      required: true

  - type: textarea
    attributes:
      label: Your Question / 你的问题
      description: |
        Describe your question clearly.
        请清晰地描述你的问题。
    validations:
      required: true

  - type: textarea
    attributes:
      label: What Have You Tried / 你已经尝试过什么
      description: |
        Describe what you've already tried or researched.
        描述你已经尝试过或查阅过的内容。
    validations:
      required: false

  - type: textarea
    attributes:
      label: Environment / 环境信息
      description: |
        OS, CPU architecture, PHI and CLI versions. Redact credentials and personal information.
        操作系统、CPU 架构、PHI 与 CLI 版本；请先移除凭据和个人信息。
      placeholder: "e.g. macOS 15, arm64, PHI 1.0.0, Codex CLI version"
    validations:
      required: false
